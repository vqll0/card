<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Terminal — vqll.net</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c0e;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .terminal {
            background: #0d0f12;
            border: 1px solid #1a2a1a;
            border-radius: 8px;
            max-width: 700px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 0, 0.03);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a2a1a;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .header .title {
            color: #00ff00;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header .status {
            color: #444;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .status .dot {
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .chat-box {
            background: #050708;
            border: 1px solid #1a2a1a;
            border-radius: 4px;
            padding: 12px 14px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #1a2a1a;
            border-radius: 2px;
        }
        .chat-box .msg {
            padding: 4px 0;
            font-size: 14px;
            line-height: 1.5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .chat-box .msg.user {
            color: #88ccff;
        }
        .chat-box .msg.user .prefix {
            color: #446688;
        }
        .chat-box .msg.ai {
            color: #00ff88;
        }
        .chat-box .msg.ai .prefix {
            color: #00aa55;
        }
        .chat-box .msg .prefix {
            font-weight: 700;
            margin-right: 8px;
        }
        .chat-box .msg.error {
            color: #ff4466;
        }
        .chat-box .msg.typing {
            color: #446644;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .input-area {
            display: flex;
            gap: 8px;
            border-top: 1px solid #1a2a1a;
            padding-top: 12px;
        }
        .input-area input {
            flex: 1;
            background: #050708;
            border: 1px solid #1a2a1a;
            border-radius: 4px;
            padding: 8px 12px;
            color: #c8c8c8;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.05);
        }
        .input-area input::placeholder {
            color: #333;
        }
        .input-area button {
            background: transparent;
            border: 1px solid #1a2a1a;
            border-radius: 4px;
            color: #00ff00;
            padding: 8px 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.2s;
            font-weight: 700;
        }
        .input-area button:hover {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
        }
        .input-area button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 12px;
            border-top: 1px solid #1a2a1a;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #333;
        }
        .footer .info {
            color: #444;
        }
        .footer .info .hl {
            color: #00ff00;
        }
    </style>
</head>
<body>

    <div class="terminal">
        <!-- Header -->
        <div class="header">
            <span class="title">⏣ AI TERMINAL</span>
            <span class="status">
                <span class="dot"></span>
                <span>online</span>
                <span style="color:#333;">|</span>
                <span style="color:#444;">mistral-tiny</span>
            </span>
        </div>

        <!-- Chat box -->
        <div class="chat-box" id="chatBox">
            <div class="msg ai">
                <span class="prefix">⏣</span>
                Hello! I'm your AI assistant. Ask me anything.
            </div>
        </div>

        <!-- Input area -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="type your message..." autofocus />
            <button id="sendBtn">➤ SEND</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="info">🔒 <span class="hl">mistral.ai</span> • tiny model</span>
            <span class="info">press <span class="hl">Enter</span> to send</span>
        </div>
    </div>

    <script>
        // ─── CONFIGURATION ───
        const API_KEY = 'CmU6jKRZXoA3YBMqMmSqnJsZwKEYK96R';
        const API_URL = 'https://api.mistral.ai/v1/chat/completions';

        // ─── DOM refs ───
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // ─── add message to chat ───
        function addMessage(text, type = 'ai') {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            const prefix = type === 'user' ? '❯' : '⏣';
            div.innerHTML = `<span class="prefix">${prefix}</span> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        // ─── show typing indicator ───
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg typing';
            div.id = 'typingIndicator';
            div.innerHTML = `<span class="prefix">⏣</span> <span style="color:#446644;">thinking...</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        // ─── remove typing indicator ───
        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ─── call Mistral API ───
        async function callMistral(userMessage) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'mistral-tiny',
                        messages: [
                            { role: 'system', content: 'You are a helpful, concise AI assistant.' },
                            { role: 'user', content: userMessage }
                        ],
                        max_tokens: 500,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('Mistral API error:', error);
                throw new Error(error.message || 'Failed to get response from AI');
            }
        }

        // ─── handle send ───
        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;

            // Clear input
            userInput.value = '';

            // Add user message
            addMessage(message, 'user');

            // Disable input
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Show typing indicator
            showTyping();

            try {
                const reply = await callMistral(message);
                removeTyping();
                addMessage(reply, 'ai');
            } catch (error) {
                removeTyping();
                addMessage(`⚠️ Error: ${error.message}`, 'error');
            }

            // Re-enable input
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        // ─── event listeners ───
        sendBtn.addEventListener('click', handleSend);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        });

        // ─── focus input on load ───
        userInput.focus();

        // ─── log key status ───
        console.log('🔑 AI Terminal ready');
        console.log('📡 API Key:', API_KEY.substring(0, 8) + '...' + API_KEY.substring(API_KEY.length - 4));
        console.log('🔗 API URL:', API_URL);
        console.log('✅ Ready to chat!');
    </script>

</body>
</html>
